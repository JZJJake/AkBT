<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股策略回测统计分析软件 (Web)</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <h2>控制面板</h2>

        <!-- Data Sync Section -->
        <div class="sync-section">
            <button class="action-btn sync-btn" onclick="syncData()">全市场数据同步</button>
            <div id="syncProgress" class="progress-container" style="display:none;">
                <div class="progress-bar">
                    <div id="syncBar" class="progress-fill" style="width: 0%"></div>
                </div>
                <div id="syncText" class="progress-text">0%</div>
            </div>
        </div>
        <hr>

        <div class="form-group">
            <label>股票代码:</label>
            <input type="text" id="stockCode" value="000001" placeholder="例如 000001">
            <button class="action-btn" onclick="loadData()">加载数据</button>
        </div>
        <hr>
        <div class="form-group">
            <label>回测开始日期:</label>
            <input type="date" id="startDate" value="2022-01-01">
        </div>
        <div class="form-group">
            <label>回测结束日期:</label>
            <input type="date" id="endDate" value="">
        </div>
        <div class="form-group">
            <label>初始资金:</label>
            <input type="number" id="initialCash" value="100000">
        </div>
        <button class="action-btn" onclick="runBacktest()">执行回测</button>

        <div id="backtestResult" class="result-box">
            <!-- 回测结果显示区域 -->
        </div>

        <hr>
        <button class="action-btn screener-btn" onclick="runScreener()">执行选股</button>

        <div id="screenerProgress" class="progress-container" style="display:none; margin-top: 10px;">
            <div class="progress-bar">
                <div id="scrBar" class="progress-fill" style="width: 0%"></div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-top: 4px;">
                <span id="scrStatus">正在扫描...</span>
                <span id="scrCount">0/0</span>
            </div>
            <div id="scrCurrent" style="font-size: 11px; color: #666; margin-top: 2px;">Checking: ...</div>
        </div>

        <div id="screenerResult" class="result-box">
            <!-- 选股结果 -->
        </div>

        <div class="resizer" id="resizer"></div>
    </div>

    <div class="main-content">
        <div class="chart-toolbar">
            <div class="stock-info" id="stockInfo">等待加载数据...</div>
            <div class="period-switch">
                <button class="p-btn active" id="btn-daily" onclick="switchPeriod('daily')">日线</button>
                <button class="p-btn" id="btn-weekly" onclick="switchPeriod('weekly')">周线</button>
                <button class="p-btn" id="btn-monthly" onclick="switchPeriod('monthly')">月线</button>
            </div>
        </div>
        <div id="chartContainer"></div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
